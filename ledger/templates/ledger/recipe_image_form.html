{% extends 'base.html' %}

{% block title %}Create Recipe Image{% endblock %}

{% block content %}
  <h2>Create Image for {{recipe.name}}</h2>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{form.as_p}}
    <input type="submit" value="Submit">
    <a href="{% url 'ledger:recipe-detail' recipe.pk %}">Back To Recipe</a>
  </form>
{% endblock %}
