{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container">
    <div class="recipe-grid">
        {% for recipe in recipes %}
        <div class="recipe-card">
            <h3><a href="{{recipe.get_absolute_url}}">{{recipe.name}}</a></h3>
        </div>
        {% endfor %}
    </div>
    <a href="{% url 'ledger:recipe-add' %}">Create New Recipe</a>
</div>
{% endblock %}
