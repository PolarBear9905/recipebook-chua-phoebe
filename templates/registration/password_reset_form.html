{% extends 'base.html' %}
{% block content %}
<main class="bg-gray-50 px-4 md:px-8">
<div class="min-h-screen flex flex-col items-center justify-center">
    <div class="max-w-md w-full">
        <div class="p-6 rounded-lg bg-white border border-slate-300 shadow-xs md:p-8">
            <h1 class="text-black text-center text-2xl font-bold mb-2">Password Reset</h1>
            <p class="text-sm text-center text-black">
                Enter your email to receive a reset link.
            </p>

            <form method="POST" class="space-y-6 mt-10">
                {% csrf_token %}
                
                <div>
                    <label for="email"
                        class="mb-2 text-slate-900 font-medium text-sm inline-block">Email</label>
                    <input type="email" id="email" name="email" placeholder="admin@gmail.com" required
                        class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
                </div>

                <button type="submit"
                    class="w-full py-2 px-3.5 text-sm rounded-md font-semibold cursor-pointer tracking-wide text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                    Send Reset Link
                </button>
                
                <div class="text-center">
                    <a href="{% url 'login' %}" class="text-sm text-gray-500 hover:text-blue-600 transition-colors">
                        Back to Login
                    </a>
                </div>
            </form>

            
        </div>
    </div>
</div>
</main>
{% endblock %}
