{% extends 'base.html' %}
{% block content %}
<main class="bg-gray-50 px-4 md:px-8">
    <div class="min-h-screen flex flex-col items-center justify-center">
        <div class="max-w-md w-full">
            <div class="p-6 rounded-lg bg-white border border-slate-300 shadow-xs md:p-8">

                <h1 class="text-slate-900 text-center text-2xl font-bold">Change Password</h1>

                {% if validlink %}
                    <form method="POST" class="space-y-6 mt-10">
                        {% csrf_token %}

                        <div>
                            <label for="id_new_password1" class="mb-2 text-slate-900 font-medium text-sm inline-block">
                                New Password
                            </label>
                            <input type="password" id="id_new_password1" name="new_password1" required
                                class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
                        </div>

                        <div>
                            <label for="id_new_password2" class="mb-2 text-slate-900 font-medium text-sm inline-block">
                                Confirm New Password
                            </label>
                            <input type="password" id="id_new_password2" name="new_password2" required
                                class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
                        </div>

                        <button type="submit"
                            class="w-full py-2.5 px-4 font-bold text-white bg-blue-600 rounded-lg cursor-pointer transition-all duration-200 hover:bg-blue-700 active:scale-95">
                            Change Password
                        </button>
                    </form>

                {% else %}
                    <div class="text-center">
                        <div class="text-red-500">
                            <svg class="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                                </path>
                            </svg>
                        </div>

                        <p class="text-lg font-semibold text-gray-900 mb-2">Invalid Reset Link!</p>
                        
                        <p class="text-sm text-gray-500">
                            The link has already been used or has expired.
                        </p>
                        
                        <a href="{% url 'password_reset' %}"
                            class="ml-auto-text-sm font-medium hover:underline">
                            Request a new link
                        </a>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</main>
{% endblock %}
